# Overnight factorial ablation for the array-refinement architecture.
#
# Fixed controls:
#   - Z3, direct abstract strategy, BMC cost
#   - prefer-source whole-instantiation ranking
#   - full-unroll frame placement
#   - depth 50, one attempt, 90-second per-benchmark cutoff
#
# Varied dimensions (2 x 2 x 4 = 16 configurations):
#   - full vs source-then-full e-graph construction
#   - scoped property assertion vs check-sat-assuming
#   - 1, 4, 16, or 48 selected candidates per configured candidate group
global:
  examples_dir: examples
  timeout_seconds: 90
  retry_count: 1
  jobs: 8
  benchmark_limit:
  sample_seed: 20260831
  require_array_reads_and_writes: true
  output_format: json
  include_patterns:
    - "examples/array/*.vmt"
    - "examples/distributed_protocols/german/german.vmt"
  exclude_patterns: []

parameter_matrices:
  array-egraph-property-budget-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [full, source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [1, 4, 16, 48]
    property_check_modes: [scoped, assumptions]
    instantiation_strategies: [full-unroll]
    timeout_seconds: 90

individual_configs:
  # Compatibility point for the pre–whole-instantiation-ranking baseline.
  # `term-cost` preserves the historical ordering without the new
  # prefer-source bias used by the factorial matrix.
  - name: preexisting-full-egraph-baseline
    depth: 50
    solver: z3
    strategy: abstract
    cost_function: bmc-cost
    egraph_builder: full
    instantiation_ranker: term-cost
    candidate_winners_per_group: 1
    property_check_mode: scoped
    instantiation_strategy: full-unroll
    timeout_seconds: 90

output:
  include_metadata: true
  pretty_json: false
  timestamp_format: "%Y%m%d_%H%M%S"
