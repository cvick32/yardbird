# Benchmark Configuration Schema
# This file defines parameter matrices for comprehensive yardbird benchmarking

# Global settings
global:
  examples_dir: "examples/array"
  timeout_seconds: 30
  retry_count: 1
  jobs: 1
  benchmark_limit:
  sample_seed: 0
  require_array_reads_and_writes: false
  output_format: "json"
  include_patterns: []
  exclude_patterns: []

# Parameter matrices - all combinations will be tested
parameter_matrices:
  # Standard evaluation matrix
  standard:
    depths: [5, 10, 15]
    solvers: ["z3"]
    strategies: ["abstract", "concrete"]
    cost_functions: ["bmc-cost", "ast-size"]

  # Quick test matrix
  quick:
    depths: [5]
    solvers: ["z3"]
    strategies: ["abstract", "concrete"]
    cost_functions: ["bmc-cost"]
    timeout_seconds: 5

  # Quick test matrix
  light-review:
    depths: [10]
    solvers: ["z3"]
    strategies: ["abstract", "concrete"]
    cost_functions: ["bmc-cost"]
    timeout_seconds: 20

  # Learned ranker comparison matrix
  logistic-regression-depth20:
    depths: [20]
    solvers: ["z3"]
    strategies: ["abstract"]
    cost_functions: ["bmc-cost", "logistic-regression"]
    timeout_seconds: 120

  timeout:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["ast-size"]
    timeout_seconds: 1

  # Deep analysis matrix
  deep:
    depths: [50]
    strategies: ["concrete", "abstract", "abstract-with-quantifiers"]
    cost_functions: ["bmc-cost"]
    timeout_seconds: 120

  deep-abstract:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["bmc-cost"]
    timeout_seconds: 120

  deep-abstract-instantiation-rankers:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["bmc-cost"]
    instantiation_rankers: ["term-cost", "prefer-source"]
    timeout_seconds: 120

  deep-abstract-cone-then-full:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["bmc-cost"]
    egraph_builders: ["cone-then-full"]
    timeout_seconds: 120

  # Single integrated formula-transformation prototype. Evaluate it on the
  # checked-in/dynamic research cohort via --formula-research-cohort.
  formula-transformations:
    depths: [50]
    solvers: ["z3"]
    strategies: ["abstract"]
    cost_functions: ["bmc-cost"]
    egraph_builders: ["cone-then-full"]
    preprocess_exact_read_after_write: true
    timeout_seconds: 120

  deep-abstract-ast:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["ast-size"]
    timeout_seconds: 120

  deep-abstract-prefer-read:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["prefer-read"]
    timeout_seconds: 120

  deep-abstract-prefer-write:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["prefer-write"]
    timeout_seconds: 120

  deep-abstract-prefer-constants:
    depths: [50]
    strategies: ["abstract"]
    cost_functions: ["prefer-constants"]
    timeout_seconds: 120

  deep-abstract-with-quantifiers:
    depths: [50]
    strategies: ["abstract-with-quantifiers"]
    cost_functions: ["ast-size"]
    timeout_seconds: 120

  deep-concrete:
    depths: [50]
    strategies: ["concrete"]
    cost_functions: ["bmc-cost"]
    timeout_seconds: 120

  # Full-array auxiliary synthesis trigger sweep. Each singleton matrix is
  # a separate main_eval AWS worker; global jobs=1 and retry_count=1 apply.
  # Hold the existing array settings fixed: depth 50, BMC cost, source-then-full,
  # prefer-source ranker, 16 winners, assumptions, full-unroll. Every matrix
  # has a 300-second per-benchmark timeout and runs the entire array corpus.
  # Guard/retention policies match array_aws_config.yaml. Only the synthesis
  # trigger changes; thresholds below are explicit initial tuning points.
  # All active triggers require a non-local conflict. Detect never synthesizes.

  array-aux-off-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    timeout_seconds: 300
    auxiliary_synthesis:
      trigger: off
      guard_policy: interpolant
      refinement_retention: drop-source
      predicate_relevance: exact-property

  array-aux-detect-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    timeout_seconds: 300
    auxiliary_synthesis:
      trigger: detect
      guard_policy: interpolant
      refinement_retention: drop-source
      predicate_relevance: exact-property

  array-aux-non-local-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    timeout_seconds: 300
    auxiliary_synthesis:
      trigger: non-local
      guard_policy: interpolant
      refinement_retention: drop-source
      predicate_relevance: exact-property

  array-aux-manual-after-10-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    timeout_seconds: 300
    auxiliary_synthesis:
      trigger: manual-after-n
      guard_policy: interpolant
      refinement_retention: drop-source
      predicate_relevance: exact-property
      manual_after: 10

  array-aux-refinement-limit-25-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    timeout_seconds: 300
    auxiliary_synthesis:
      trigger: refinement-limit
      guard_policy: interpolant
      refinement_retention: drop-source
      predicate_relevance: exact-property
      refinement_limit_window: 25

  array-aux-repeated-pattern-3-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    timeout_seconds: 300
    auxiliary_synthesis:
      trigger: repeated-pattern
      guard_policy: interpolant
      refinement_retention: drop-source
      predicate_relevance: exact-property
      repeated_pattern_threshold: 3

  array-aux-concrete-depth50:
    depths: [50]
    solvers: [z3]
    strategies: [concrete]
    cost_functions: [bmc-cost]
    egraph_builders: [full]
    property_check_modes: [assumptions]
    timeout_seconds: 300

# Individual configurations (non-matrix)
individual_configs:
  - name: "abstract_only_quick"
    depth: 10
    strategy: "abstract"
    cost_function: "bmc-cost"
    timeout_seconds: 15

  - name: "concrete_deep"
    depth: 25
    strategy: "concrete"
    cost_function: "ast-size"
    timeout_seconds: 120

# Output configuration
output:
  include_metadata: true
  pretty_json: true
  timestamp_format: "%Y%m%d_%H%M%S"

# Cloud execution settings
cloud:
  instance_type: "c5.xlarge"
  region: "us-west-2"
  s3_bucket: "yardbird-benchmarks"
  auto_teardown: true
