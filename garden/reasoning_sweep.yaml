# End-to-end reasoning-effort sweep. One trial per invocation; retries are not repeats.
# Matched joint-proposal interface, ranking, installation, and timeout.
# Run with --guided-dry-run for an offline wiring check (not evaluation data).
global:
  examples_dir: examples/array
  timeout_seconds: 120
  retry_count: 1
  jobs: 1
  output_format: json
  include_patterns: []
  exclude_patterns: []

parameter_matrices:

  # Uniform axiom, then uniform independent well-sorted bindings, with replacement.
  random-1:
    policy: random-instantiation
    no_guided_fallback: true
    random:
      random_seed: 0
      random_samples: 1
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [term-cost]
    candidate_winners_per_group: [1]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]

  # Uniform axiom, then uniform independent well-sorted bindings, with replacement.
  random-1000:
    policy: random-instantiation
    no_guided_fallback: true
