# Full quantified-transition corpus; depth 20, 500 seconds per run.
# Eight winners from qts-pilot-r1-aws-20261114_000145.
# Include fastest successful runtimes (exact ties included), plus greatest
# completed depth on benchmarks nobody finished. The latter adds no policies:
# qts-z3 and qts-always16384 already have runtime wins.
# Selection source: full/report/data/{strategy_summary,completed_depths}.csv
global:
  examples_dir: examples/quantified-transition-systems/generated-vmt
  timeout_seconds: 500
  retry_count: 1
  jobs: 1
  benchmark_limit: null
  sample_seed: 20261113
  require_array_reads_and_writes: false
  output_format: json
  include_patterns:
  - '**/*.vmt'
  exclude_patterns: []
parameter_matrices:
  qts-z3:
    depths:
    - 20
    solvers:
    - z3
    strategies:
    - concrete
    cost_functions:
    - bmc-cost
    egraph_builders:
    - full
    instantiation_rankers:
    - prefer-source
    candidate_winners_per_group:
    - 1
    property_check_modes:
    - assumptions
    instantiation_strategies:
    - full-unroll
    prefer_axioms: false
    auxiliary_synthesis:
      trigger: 'off'
      guard_policy: 'true'
  qts-guided1024:
    depths:
    - 20
    solvers:
    - z3
    strategies:
    - abstract
    cost_functions:
