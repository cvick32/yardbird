# Guided reference: supplement, work 1024, predecessor-first,
# action requirements when-unproductive, prefer-axioms off.
# Keep profiling and solver capture off. Workers pull main: push this config
# and its option plumbing before launching. Report parser support is separate.
global:
  examples_dir: examples/distributed_protocols
  timeout_seconds: 500
  retry_count: 1
  jobs: 1
  benchmark_limit:
  sample_seed: 20260923
  require_array_reads_and_writes: false
  output_format: json
  include_patterns: ["**/*.encoding.vmt"]
  exclude_patterns: []

parameter_matrices:
  protocol-bmc-w16:
    prefer_axioms: false
    depths: [20]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    auxiliary_synthesis:
      trigger: off
      guard_policy: "true"

  protocol-german-fast:
