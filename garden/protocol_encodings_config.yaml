# Countermodel comparison over the current encoded protocol corpus.
# One singleton matrix per AWS worker; one attempt per input, run sequentially.
# Historical leaders retain 16 winners. The matched guidance-off/immediate/
# supplement comparison uses the named policies' fixed 20-winner setting.
# Keep tracing/profiling and solver-journal capture off for timing comparisons.
# Launch after this config and the Garden policy wiring are available on main:
# python3 main_eval.py --env aws --config garden/protocol_encodings_config.yaml \
#   --benchmark-type protocol-bmc-cost-prefer-source-w16 \
#   --benchmark-type protocol-bmc-prefer-source-w16 \
#   --benchmark-type protocol-german-fast \
#   --benchmark-type protocol-countermodel-immediate \
#   --benchmark-type protocol-countermodel-supplement \
#   --benchmark-type protocol-concrete-z3 \
#   --name protocol-countermodel-depth20-500s

global:
  examples_dir: examples/distributed_protocols
  timeout_seconds: 500
  retry_count: 1
  jobs: 1
  benchmark_limit:
  sample_seed: 20260923
  require_array_reads_and_writes: false
  output_format: json
  include_patterns: ["**/*.encoding.vmt"]
  exclude_patterns: []

parameter_matrices:

  protocol-bmc-cost-prefer-source-w16:
    depths: [20]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    auxiliary_synthesis:
      trigger: off
      guard_policy: "true"

  protocol-bmc-prefer-source-w16:
    depths: [20]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [protocol-bmc]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    auxiliary_synthesis:
      trigger: off
      guard_policy: "true"

  protocol-german-fast:
    policy: german-fast
    depths: [20]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [20]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    auxiliary_synthesis:
      trigger: off
      guard_policy: "true"

  protocol-countermodel-immediate:
    policy: countermodel-guided
    guidance_schedule: immediate
    depths: [20]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [20]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    auxiliary_synthesis:
      trigger: off
      guard_policy: "true"

  protocol-countermodel-supplement:
    policy: countermodel-guided
    guidance_schedule: supplement
    depths: [20]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [20]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    auxiliary_synthesis:
      trigger: off
      guard_policy: "true"

  protocol-concrete-z3:
    depths: [20]
    solvers: [z3]
    strategies: [concrete]
    cost_functions: [bmc-cost]
    egraph_builders: [full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [1]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
    auxiliary_synthesis:
      trigger: off
      guard_policy: "true"

individual_configs: []

output:
  include_metadata: true
  pretty_json: false
  timestamp_format: "%Y%m%d_%H%M%S"
