# Original 20 quantified-transition-system VMT inputs; depth 20, 500 seconds each.
# Fifteen policies: native/ordinary baselines and guided budget/order/prerequisite ablations.
# Timing runs: no profile, solver capture, decision logging, or IC3IA.
# One attempt per case; independent campaigns provide repetitions.
global:
  examples_dir: examples/quantified-transition-systems/generated-vmt
  timeout_seconds: 500
  retry_count: 1
