# Batching sensitivity experiment: no API policies or model calls.
# Same revision, corpus, depth, timeout and installation as the main evaluation.
# Repeat the original selection configuration on the evaluation host before comparing.
global:
  examples_dir: examples/array
  timeout_seconds: 120
  retry_count: 1
  jobs: 1
  output_format: json
  include_patterns: []
  exclude_patterns: []

parameter_matrices:
  source16:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [16]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
  source1:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [prefer-source]
    candidate_winners_per_group: [1]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
  term1:
    depths: [50]
    solvers: [z3]
    strategies: [abstract]
    cost_functions: [bmc-cost]
    egraph_builders: [source-then-full]
    instantiation_rankers: [term-cost]
    candidate_winners_per_group: [1]
    property_check_modes: [assumptions]
    instantiation_strategies: [full-unroll]
